name: 🚀 Feature request
description: Suggest an idea for lightsout
labels: [enhancement]
assignees: [abhisheksinha1506]
body:
  - type: markdown
    attributes:
      value: Please search existing issues first; this may already be requested.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should lightsout behave? Example commands or config are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
