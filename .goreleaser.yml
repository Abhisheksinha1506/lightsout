version: 2
project_name: lightsout
release:
  github:
    owner: abhisheksinha1506
    name: lightsout
  prerelease: auto
  # Release title, e.g. "lightsout v1.2.0"
  name_template: "{{ .ProjectName }} {{ .Tag }}"
before:
  hooks:
    - go mod download
builds:
  - goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "6"
      - "7"
    ignore:
      # 32-bit ARM Windows is not supported.
      - goos: windows
        goarch: arm
    # .Tag keeps the leading "v" so it matches GitHub's tag_name in the update check
    ldflags:
      - -s -w -X github.com/abhisheksinha1506/lightsout/pkg/version.Version={{.Tag}}
archives:
  - files:
      - README.md
      - LICENSE.md
      - CHANGELOG.md
      - lightsout.1
      - completions/*
    format_overrides:
      # Windows users expect .zip; macOS and Linux keep .tar.gz.
      - goos: windows
        formats: [zip]
# SBOMs (SPDX JSON, made by syft) for each archive.
sboms:
  - artifacts: archive
# Keyless cosign signature of the checksums file, using the release
# workflow's GitHub OIDC identity. Verify with:
#   cosign verify-blob --bundle lightsout_<version>_checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/abhisheksinha1506/lightsout/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     lightsout_<version>_checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: '${artifact}.sigstore.json'
    args: ['sign-blob', '--bundle=${signature}', '${artifact}', '--yes']
homebrew_casks:
  - repository:
      owner: abhisheksinha1506
      name: homebrew-tap
    homepage: 'https://github.com/abhisheksinha1506/lightsout'
    description: '🌙 Quit all applications with one terminal command'
    manpages:
      - lightsout.1
    completions:
      bash: completions/lightsout.bash
      zsh: completions/_lightsout
      fish: completions/lightsout.fish
    commit_author:
      name: abhisheksinha1506
      email: abhisheksinha1506@gmail.com
    # lightsout is not signed or notarized, so macOS would quarantine it and
    # refuse to run it ("is damaged and cannot be opened"). Clear the quarantine bit.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/lightsout"]
          end
# .deb and .rpm packages for Linux, attached to each release. They depend on
# the tools lightsout uses to find and close windows.
nfpms:
  - package_name: lightsout
    homepage: https://github.com/abhisheksinha1506/lightsout
    maintainer: Abhishek Sinha <abhisheksinha1506@gmail.com>
    description: Quit all open apps with one command, without force-killing.
    license: MIT
    formats: [deb, rpm]
    dependencies:
      - wmctrl
    overrides:
      deb:
        dependencies: [wmctrl, x11-utils]
      rpm:
        dependencies: [wmctrl, xprop]
    contents:
      - src: lightsout.1
        dst: /usr/share/man/man1/lightsout.1
      - src: completions/lightsout.bash
        dst: /usr/share/bash-completion/completions/lightsout
      - src: completions/lightsout.fish
        dst: /usr/share/fish/vendor_completions.d/lightsout.fish
      - src: completions/_lightsout
        dst: /usr/share/zsh/vendor-completions/_lightsout
        packager: deb
      - src: completions/_lightsout
        dst: /usr/share/zsh/site-functions/_lightsout
        packager: rpm
# Scoop manifest for Windows, pushed to abhisheksinha1506/scoop-bucket.
scoops:
  - name: lightsout
    repository:
      owner: abhisheksinha1506
      name: scoop-bucket
    homepage: https://github.com/abhisheksinha1506/lightsout
    description: Quit all open apps with one command, without force-killing.
    license: MIT
    commit_author:
      name: abhisheksinha1506
      email: abhisheksinha1506@gmail.com
# Each release pushes a winget manifest to the fork
# abhisheksinha1506/winget-pkgs and opens a pull request to
# microsoft/winget-pkgs. GORELEASER_PAT must be able to push to the fork and
# open that pull request (a classic token with the public_repo scope).
winget:
  - name: lightsout
    publisher: Abhishek Sinha
    package_identifier: AbhishekSinha.lightsout
    short_description: Quit all open apps with one command, without force-killing.
    license: MIT
    homepage: https://github.com/abhisheksinha1506/lightsout
    publisher_url: https://github.com/abhisheksinha1506
    tags: [cli, productivity, windows]
    commit_author:
      name: abhisheksinha1506
      email: abhisheksinha1506@gmail.com
    repository:
      owner: abhisheksinha1506
      name: winget-pkgs
      branch: "lightsout-{{ .Version }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
