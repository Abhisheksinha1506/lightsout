version: 2
project_name: lightsout
release:
  github:
    owner: abhisheksinha1506
    name: lightsout
  prerelease: auto
before:
  hooks:
    - go mod download
builds:
  - goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "6"
      - "7"
    ignore:
      # 32-bit ARM Windows is not supported.
      - goos: windows
        goarch: arm
    # .Tag keeps the leading "v" so it matches GitHub's tag_name in the update check
    ldflags:
      - -s -w -X github.com/abhisheksinha1506/lightsout/pkg/version.Version={{.Tag}}
archives:
  - format_overrides:
      # Windows users expect .zip; macOS and Linux keep .tar.gz.
      - goos: windows
        formats: [zip]
homebrew_casks:
  - repository:
      owner: abhisheksinha1506
      name: homebrew-tap
    homepage: 'https://github.com/abhisheksinha1506/lightsout'
    description: '🌙 Quit all applications with one terminal command'
    commit_author:
      name: abhisheksinha1506
      email: abhisheksinha1506@gmail.com
    # lightsout is not signed or notarized, so macOS would quarantine it and
    # refuse to run it ("is damaged and cannot be opened"). Clear the quarantine bit.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/lightsout"]
          end
    # The repository is private, so release files can't be downloaded
    # anonymously. This download strategy (from GoReleaser's docs) fetches them
    # through the GitHub API with HOMEBREW_GITHUB_API_TOKEN, which the user
    # exports in their shell. The token is only sent as a request header.
    custom_block: |
      require "download_strategy"

      class GitHubPrivateRepositoryReleaseDownloadStrategy < CurlDownloadStrategy
        def initialize(url, name, version, **meta)
          @url = url
          parse_url_pattern
          set_github_token
          meta[:headers] ||= []
          meta[:headers] << "Accept: application/octet-stream"
          meta[:headers] << "Authorization: Bearer #{@github_token}"
          super("https://api.github.com/repos/#{@owner}/#{@repo}/releases/assets/#{asset_id}", name, version, **meta)
        end

        private

        def parse_url_pattern
          url_pattern = %r{https://github.com/([^/]+)/([^/]+)/releases/download/([^/]+)/(\S+)}
          raise CurlDownloadStrategyError, "Invalid url pattern" unless @url =~ url_pattern

          _, @owner, @repo, @tag, @filename = *@url.match(url_pattern)
        end

        def set_github_token
          @github_token = ENV["HOMEBREW_GITHUB_API_TOKEN"]
          raise CurlDownloadStrategyError, "HOMEBREW_GITHUB_API_TOKEN is required." unless @github_token

          GitHub.repository(@owner, @repo) # fails early if the token can't read the repo
        end

        def asset_id
          @asset_id ||= GitHub.get_release(@owner, @repo, @tag)["assets"]
                              .find { |a| a["name"] == @filename }
                              .fetch("id") { raise CurlDownloadStrategyError, "Asset not found" }
        end
      end
    url:
      template: "https://github.com/abhisheksinha1506/lightsout/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
      using: GitHubPrivateRepositoryReleaseDownloadStrategy
